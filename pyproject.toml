[project]
name = "nano-infer"
version = "0.0.1"
description = "An LLM inference engine built from scratch in PyTorch, focused on speed and correctness."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aksh Patel" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "tiktoken>=0.8",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "transformers>=4.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoinfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: downloads model weights; run with -m slow"]
